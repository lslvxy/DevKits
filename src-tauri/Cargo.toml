[package]
name = "devkits"
version = "0.1.0"
description = "DevKits — 插件化开发者工具集"
authors = []
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std", "3des", "des-insecure", "sha1-insecure"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
